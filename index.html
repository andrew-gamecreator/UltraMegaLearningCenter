<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learner Center</title>
<style>
:root{--bg1:#fff4d6;--bg2:#dff1ff;--card:#fff;--ink:#23204a;--sub:#6a678f;--ac:#ff7a1a;--pu:#7b5cff;--gr:#2ec27e;--rd:#ff5470;--bd:#e3def7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d1a3a;--bg2:#12243a;--card:#2a2750;--ink:#f3f0ff;--sub:#b3afd9;--bd:#433f78}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;padding-bottom:84px;user-select:none;-webkit-user-select:none}
#app{max-width:820px;margin:0 auto;padding:0 12px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 4px 8px;background:linear-gradient(var(--bg1),transparent)}
.logo{font-weight:900;font-size:22px;color:var(--pu);letter-spacing:.5px}
#pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:3px 10px;font-weight:800;font-size:15px}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#ffc933 60%,#d99a00);border:2px solid #b87d00;display:inline-block}
.chip{width:16px;height:16px;border-radius:50%;background:#e63946;border:3px dashed #fff;outline:2px solid #e63946;display:inline-block}
.stk{width:16px;height:16px;display:inline-block;background:var(--pu);clip-path:polygon(50% 0,62% 36%,98% 38%,70% 60%,80% 96%,50% 74%,20% 96%,30% 60%,2% 38%,38% 36%)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:3px solid var(--bd)}
nav button{flex:1;max-width:150px;font:inherit;font-weight:800;font-size:14px;padding:10px 4px;border:0;border-radius:12px;background:transparent;color:var(--sub);cursor:pointer}
nav button.on{background:var(--pu);color:#fff}
h2{margin:6px 0}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 4px 0 var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.22);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pu{background:var(--pu)}.btn.gr{background:var(--gr)}.btn.gh{background:transparent;color:var(--ink);border:2px solid var(--bd);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{display:flex;align-items:center;gap:10px}
.hero .pip{width:150px;flex:none}
.bub{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:10px 14px;font-weight:700;font-size:16px;flex:1}
.bub:before{content:"";position:absolute;left:-10px;top:24px;border:8px solid transparent;border-right-color:var(--bd);border-left:0}
.sub{border:0;border-radius:18px;padding:14px 8px;color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s}
.sub:hover{transform:translateY(-3px)}.sub:active{transform:translateY(3px);box-shadow:none}
.sub b{font-size:34px;line-height:1}.sub span{font-weight:800}.sub small{opacity:.9}
.lv{display:flex;gap:3px}.lv i{width:10px;height:10px;border-radius:50%;background:#fff5}.lv i.on{background:#fff}
.pip{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%;overflow:visible}
.pip.cheer{animation:jump .8s ease}.pip.sad{animation:wob .6s}
.pip.sm{width:96px}
@keyframes bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-6px) scaleY(1.025)}}
@keyframes jump{0%{transform:scale(1.06,.9)}30%{transform:translateY(-44px) scale(.94,1.08)}60%{transform:scale(1.07,.93)}100%{transform:none}}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}80%{transform:rotate(-4deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.arm{transform-box:fill-box;transform-origin:50% 12%;transition:transform .25s}
.arm.l{transform:rotate(14deg)}.arm.r{transform:rotate(-14deg)}
.cheer .arm.l{transform:rotate(160deg)}.cheer .arm.r{transform:rotate(-160deg)}
.rd{padding-top:6px}
.rtop{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:16px;background:var(--card);border:2px solid var(--bd);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),#9be15d);transition:width .3s}
.fl{font-weight:900;color:var(--sub);white-space:nowrap}.fl.hot{color:var(--ac);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.2)}}
.rm{display:flex;align-items:center;gap:8px;margin:6px 0}
.q{text-align:center}
.q h2{font-size:26px}
.vis{min-height:90px;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:900;color:var(--pu);margin:8px 0}
.vis svg{width:110px;height:110px}
.vis .big{font-size:76px;letter-spacing:6px}
.dots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:300px}
.dots i{width:30px;height:30px;border-radius:50%;background:var(--ac);animation:pop .4s backwards}
.dots i:nth-child(3n){background:var(--gr)}.dots i:nth-child(3n+1){background:var(--pu)}.dots i:nth-child(5n){background:var(--rd)}
@keyframes pop{from{transform:scale(0)}}
.sw{width:110px;height:90px;border-radius:20px;border:4px solid var(--bd)}
.seq{display:flex;gap:8px}.seq i{width:42px;height:42px;border-radius:50%;border:3px solid #0003}
.seq i.qm{background:var(--card);display:flex;align-items:center;justify-content:center;font:900 24px sans-serif;font-style:normal;color:var(--sub)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opt{font:inherit;font-weight:900;font-size:24px;padding:18px 6px;border-radius:16px;border:3px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--bd);transition:transform .1s}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.good{background:var(--gr);color:#fff;border-color:#1c9a63;animation:pop .35s}
.opt.bad{background:var(--rd);color:#fff;border-color:#c93550;animation:wob .4s}
.hear{font:inherit;font-weight:800;border:2px solid var(--bd);background:transparent;color:var(--sub);border-radius:20px;padding:4px 14px;cursor:pointer}
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.sk{background:var(--card);border:2px dashed var(--bd);border-radius:16px;padding:8px 4px;text-align:center}
.sk svg{width:72px;height:72px}.sk.lock svg{opacity:.35}
.sk b{display:block;font-size:13px}.sk small{display:block;font-size:11px;color:var(--sub)}
.sk.new svg{animation:pop .5s}
.item{text-align:center;padding:8px}.item .pip{width:100px;animation:none}
.item b{display:block}.item .btn{width:100%;margin-top:6px;padding:7px}
.sks{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.skin{width:34px;height:34px;border-radius:50%;border:3px solid var(--bd);cursor:pointer}.skin.on{outline:4px solid var(--pu)}
.gcard{display:flex;align-items:center;gap:12px}
.gcard .gi{width:64px;height:64px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:26px}
.gcard .m{flex:1}.gcard small{color:var(--sub)}
.rowf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
select,input[type=text]{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--ink);max-width:100%;user-select:text}
input[type=range]{width:160px}
.board{background:#2f6b4f;color:#fff;border:6px solid #c98a4b;border-radius:16px;padding:14px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.25);animation:slidein .45s;margin:6px 0}
.board .bt{font-weight:900;letter-spacing:1px;opacity:.85;font-size:13px}
.board .bigc{min-height:120px;display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:900;cursor:pointer;margin:6px 0;flex-wrap:wrap;color:#fff}
.board .big{font-size:84px;letter-spacing:4px;color:#fff}
.board .bigc svg{width:120px;height:120px}
.board p{margin:6px 0 2px;font-size:15px;font-weight:700;opacity:.9}
.board .dots{margin:6px auto}
.hl{color:#ffd23f}
.eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-size:44px}
.dots.sm i{width:20px;height:20px}.dots.sm{gap:6px;max-width:170px}
.dots i.x{opacity:.25}
.qa small{display:block;font-size:20px;font-weight:700}.qa b{font-size:46px;color:#ffd23f}
.ph{display:flex;gap:6px;align-items:center;flex:1}.ph span{flex:1;text-align:center;font-weight:800;font-size:13px;padding:4px;border-radius:10px;background:var(--card);border:2px solid var(--bd);color:var(--sub)}.ph span.on{background:var(--pu);color:#fff;border-color:var(--pu)}.ph span.dn{background:var(--gr);color:#fff;border-color:var(--gr)}
.cdots{display:flex;gap:6px;justify-content:center;margin:10px 0}.cdots i{width:10px;height:10px;border-radius:50%;background:var(--bd)}.cdots i.on{background:var(--pu)}
.qc{font-weight:800;color:var(--sub);font-size:13px}
@keyframes slidein{from{transform:translateX(40px) scale(.95);opacity:0}}
.balloon .opt{border-radius:50%/60% 60% 40% 40%;animation:flt 2.4s ease-in-out infinite;background:linear-gradient(135deg,#ff9ac0,#ff5470);color:#fff;border-color:#c93550}
.balloon .opt:nth-child(2){background:linear-gradient(135deg,#9ad0ff,#2f86ff);border-color:#1f5fc4;animation-delay:.3s}.balloon .opt:nth-child(3){background:linear-gradient(135deg,#a6f58f,#2ec27e);border-color:#1c9a63;animation-delay:.6s}.balloon .opt:nth-child(4){background:linear-gradient(135deg,#ffe27a,#ff9d2e);border-color:#c97a00;animation-delay:.9s}
.balloon .opt.good{background:#2ec27e!important;animation:pop .35s}.balloon .opt.bad{background:#ff5470!important;animation:wob .4s}
@keyframes flt{50%{transform:translateY(-8px)}}
.chipk{display:inline-block;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:4px 10px;margin:3px;font-weight:800}
.md{position:fixed;inset:0;z-index:200;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}.mc{background:var(--card);color:var(--ink);padding:20px;border-radius:16px;max-width:340px;text-align:center;font-weight:700}
.lvbtns{display:grid;gap:8px}.lvb{display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.sub.lvb{flex-direction:row;text-align:left;padding:12px 16px}.sub:disabled{opacity:.7;cursor:not-allowed}.sub.lvb:disabled:hover{transform:none}
.board .chipk{background:#ffffff22;border-color:#ffffff66;color:#fff;transition:transform .1s}.board .chipk:active{transform:scale(.94)}
.board .bigc.cmp{font-size:18px;min-height:0;cursor:default;gap:4px;font-weight:700}
.board .bigc.cmp .dots{margin:4px auto 0}
.fct{width:100%;text-align:left;background:#ffffff1f;border-radius:12px;padding:8px 12px;margin:4px 0;cursor:pointer;font-size:17px;font-weight:700}
.board .eq{color:#fff}.board .seq i{border-color:#fff}
.board .dots{max-width:none}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:0;right:0;z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.t{background:var(--ink);color:var(--card);padding:8px 16px;border-radius:20px;font-weight:800;animation:tin .3s,tout .4s 2.6s forwards;max-width:90%;text-align:center}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.fp{position:fixed;z-index:95;font:900 28px sans-serif;color:#ffc933;-webkit-text-stroke:1px #8a5d00;pointer-events:none;animation:fup 1.1s forwards}
@keyframes fup{to{transform:translateY(-70px);opacity:0}}
#fx{position:fixed;inset:0;z-index:80;pointer-events:none}
#game{position:fixed;inset:0;z-index:100;background:#10122b;display:none;flex-direction:column;align-items:center;color:#fff}
#game.on{display:flex}
#gbar{width:100%;max-width:640px;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 6px;font-weight:800}
#gbar span{flex:1;text-align:center}
#gc{touch-action:none;border-radius:12px;background:#000;cursor:crosshair}
#gend{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;font-size:20px}
.gb{font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px 12px;background:#ffffff26;color:#fff;cursor:pointer}
#gf{flex:1;width:100%;max-width:1100px;border:0;background:#000;display:none}
.big2{font-size:34px;font-weight:900}

.gbk h2{margin:0 0 4px}
.gbk label{display:block;font-weight:800;margin:10px 0 4px}
.gbk input[type=text],.gbk textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--ink);user-select:text;-webkit-user-select:text}
.gbk textarea{min-height:84px;resize:vertical}
.gbk .gbc{text-align:right;font-size:12px;color:var(--sub);margin:2px 0 8px}
.gbk .gbsub{margin:0;color:var(--sub);font-size:14px}
.gbst{min-height:1.4em;margin:8px 0;font-weight:800;color:var(--gr)}.gbst.bad{color:var(--rd)}
.gbn{border:2px solid var(--bd);border-radius:14px;padding:8px 12px;margin:8px 0;background:var(--bg2)}
.gbn b{font-size:16px}.gbn small{color:var(--sub);margin-left:6px}
.gbn p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.gbe{color:var(--sub)}

.plk h2{margin:0 0 10px}
.plb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.plr{margin:6px 0}
.plr .plt{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.plr .plt span:last-child{color:var(--sub);font-weight:700}
.plbar{height:14px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:4px}
.plbar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}
</style></head><body>

<nav id="nav"><button data-t="learn">Learn</button><button data-t="pip">Pip's Closet</button><button data-t="stick">Stickers</button><button data-t="arc">Arcade</button><button data-t="set">Settings</button></nav>
<div id="toast"></div><canvas id="fx"></canvas>
<div id="game"><div id="gbar"><button class="gb" id="gq">Quit</button><span id="gname"></span><span id="gt"></span><span id="gs"></span><button class="gb" id="gx">+ Time</button></div>
<canvas id="gc" width="480" height="640"></canvas><iframe id="gf" title="Arcade game" allow="autoplay; fullscreen; gamepad; clipboard-write"></iframe>
<div id="gend"><div class="big2" id="gh"></div><div id="gsc"></div><div><button class="gb" id="gag">Play again</button> <button class="gb" id="gcl">Back to arcade</button></div></div></div>

let lastF=0;function fxLoop(t){const dt=Math.min(.05,(t-lastF)/1000);lastF=t;fc.clearRect(0,0,FX.width,FX.height);PA=PA.filter(p=>(p.l-=dt)>0);for(const p of PA){p.vy+=1200*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=dt*8;fc.save();fc.translate(p.x,p.y);fc.rotate(p.a);fc.globalAlpha=Math.min(1,p.l);fc.fillStyle=p.c;fc.fillRect(-p.r,-p.r/2,p.r*2,p.r);fc.restore()}if(PA.length)requestAnimationFrame(fxLoop);else fxOn=false}
